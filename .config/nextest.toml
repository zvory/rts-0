[profile.default]
# Keep local output compact while still surfacing per-test status and slow tests.
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"

# This 6,000-tick Classic-map simulation also exceeds two minutes on GitHub's
# runners on main. Keep its full assertions and allow it to finish without
# increasing the timeout for other tests.
[[profile.default.overrides]]
filter = 'binary(=rush_ai) & test(=rush_classic_keeps_the_engineer_back_and_finishes_the_timed_transitions)'
slow-timeout = { period = "60s", terminate-after = 4 }
