[profile.default]
# Keep local output compact while still surfacing per-test status and slow tests.
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"

# These opening simulations can run up to 9,000 ticks after the research-cost
# increase, exceeding two minutes on GitHub runners. Keep their full assertions
# and allow both map variants to finish without raising other tests' timeouts.
[[profile.default.overrides]]
filter = 'binary(=rush_ai) & (test(=rush_classic_keeps_the_engineer_back_and_finishes_the_timed_transitions) | test(=rush_opening_transitions_research_production_and_respects_engineer_standoff))'
slow-timeout = { period = "60s", terminate-after = 4 }

# Eco's ordinary-income integration covers four expansions, three research steps and a surplus
# fifth Barracks (up to 18,000 ticks), with debug simulation invariants enabled throughout.
[[profile.default.overrides]]
filter = 'binary(=eco_ai) & test(=eco_classic_economy_reaches_four_bases_and_mixed_entrenched_defense)'
slow-timeout = { period = "60s", terminate-after = 4 }
