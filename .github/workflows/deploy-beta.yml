name: Deploy beta

on:
  push:
    branches:
      - main

concurrency:
  # Keep one active beta deploy and at most one pending replacement. This coalesces frequent
  # pushes to main without interrupting an in-flight Fly deploy/drain.
  group: beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy beta server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy beta
        run: ./deploy.sh beta ${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BETA_API_TOKEN }}
