[package]
name = "rts-rules"
version = "0.1.0"
edition = "2021"
description = "Gameplay domain vocabulary, balance data, and pure rules for Bewegungskrieg"

[dependencies]
serde = { version = "1", features = ["derive"] }

# Pin the portable algorithms: changing libm changes simulation trajectories.
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
